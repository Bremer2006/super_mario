name: Build Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Arrange Flat Repo Files into Android Structure & Build APK
        run: |
          set -e
          mkdir -p app/src/main/java/com/coopbros/game
          mkdir -p app/src/main/assets

          # Copy your uploaded root files directly into their required Android folders
          cp -f index.html app/src/main/assets/index.html
          cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp -f MainActivity.java app/src/main/java/com/coopbros/game/MainActivity.java

          # Create root build.gradle
          cat << 'ROOT_EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          ROOT_EOF

          # Create app/build.gradle
          cat << 'APP_EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.coopbros.game'
              compileSdk 34

              defaultConfig {
                  applicationId "com.coopbros.game"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "1.1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          APP_EOF

          ls -lh app/src/main/assets/index.html
          gradle :app:assembleDebug --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: super-coop-bros-apk
          path: app/build/outputs/apk/debug/app-debug.apk
